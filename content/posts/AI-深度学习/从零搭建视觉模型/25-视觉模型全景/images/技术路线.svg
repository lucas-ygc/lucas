<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1020" viewBox="0 0 720 1020" role="img" aria-labelledby="title desc">
<title id="title">当前视觉技术路线关系图</title><desc id="desc">共享视觉表示支持专用感知、提示感知、视觉语言、生成与三维视频；箭头表示可复用关系，不是替代顺序。</desc>
<rect width="720" height="1020" rx="20" fill="#f8f3e9"/>
<g font-family="'Kaiti SC','KaiTi','STKaiti','Noto Serif CJK SC',serif" fill="#293e3c">
<text x="32" y="57" font-size="36" fill="#293e3c">当前视觉技术路线</text>
<text x="32" y="99" font-size="25" fill="#587873">任务不同，组件与训练方法可以复用</text>
<rect x="32" y="131" width="656" height="112" rx="14" fill="#e7eeE8"/>
<text x="55" y="174" font-size="30" fill="#293e3c">共享基础：视觉表示与预训练</text>
<text x="55" y="216" font-size="26" fill="#293e3c">CNN · Transformer · 混合结构</text>
<path d="M 58 243 V 925" fill="none" stroke="#78938a" stroke-width="3"/>
<path d="M 58 313 H 87" stroke="#78938a" stroke-width="3"/><path d="M 80 307 L 89 313 L 80 319" fill="none" stroke="#78938a" stroke-width="3"/>
<rect x="96" y="270" width="592" height="90" rx="14" fill="#e7eee8"/>
<text x="116" y="305" font-size="28" fill="#293e3c">专用感知</text>
<text x="116" y="340" font-size="25" fill="#293e3c">分类、检测、分割、关键点与跟踪</text>
<path d="M 58 423 H 87" stroke="#78938a" stroke-width="3"/><path d="M 80 417 L 89 423 L 80 429" fill="none" stroke="#78938a" stroke-width="3"/>
<rect x="96" y="380" width="592" height="90" rx="14" fill="#eee3d4"/>
<text x="116" y="415" font-size="28" fill="#293e3c">通用视觉表示</text>
<text x="116" y="450" font-size="25" fill="#293e3c">先提取可迁移特征，再适配任务</text>
<path d="M 58 533 H 87" stroke="#78938a" stroke-width="3"/><path d="M 80 527 L 89 533 L 80 539" fill="none" stroke="#78938a" stroke-width="3"/>
<rect x="96" y="490" width="592" height="90" rx="14" fill="#e7eee8"/>
<text x="116" y="525" font-size="28" fill="#293e3c">开放词汇与提示式感知</text>
<text x="116" y="560" font-size="25" fill="#293e3c">用文字、点、框或示例指定目标</text>
<path d="M 58 643 H 87" stroke="#78938a" stroke-width="3"/><path d="M 80 637 L 89 643 L 80 649" fill="none" stroke="#78938a" stroke-width="3"/>
<rect x="96" y="600" width="592" height="90" rx="14" fill="#eee3d4"/>
<text x="116" y="635" font-size="28" fill="#293e3c">视觉语言</text>
<text x="116" y="670" font-size="25" fill="#293e3c">图像 / 视频 + 文字 → 描述与回答</text>
<path d="M 58 753 H 87" stroke="#78938a" stroke-width="3"/><path d="M 80 747 L 89 753 L 80 759" fill="none" stroke="#78938a" stroke-width="3"/>
<rect x="96" y="710" width="592" height="90" rx="14" fill="#e7eee8"/>
<text x="116" y="745" font-size="28" fill="#293e3c">图像与视频生成</text>
<text x="116" y="780" font-size="25" fill="#293e3c">条件 → 内容；兼顾控制与一致性</text>
<path d="M 58 863 H 87" stroke="#78938a" stroke-width="3"/><path d="M 80 857 L 89 863 L 80 869" fill="none" stroke="#78938a" stroke-width="3"/>
<rect x="96" y="820" width="592" height="90" rx="14" fill="#eee3d4"/>
<text x="116" y="855" font-size="28" fill="#293e3c">三维与空间 / 世界模型</text>
<text x="116" y="890" font-size="25" fill="#293e3c">几何重建、空间关系与未来预测</text>
<text x="32" y="974" font-size="25" fill="#587873">连线表示联系与复用，不表示继承或取代</text>
</g></svg>
