<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1056" viewBox="0 0 1100 1056" role="img" aria-label="一帧图像的五阶段分析">
<title>一帧图像的五阶段分析</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526a73"/></marker></defs>
<rect width="100%" height="100%" rx="20" fill="#f7f3e9"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#293e47">
<text x="48" y="60" font-size="30" font-weight="bold">一帧图像的五阶段分析</text>
<rect x="48" y="100" width="570" height="76" rx="12" fill="#e4ece8" stroke="#879b97"/>
<text x="70" y="130" font-size="23" font-weight="bold">原始图像与观察时间</text>
<text x="70" y="159" font-size="18">BGR888 / 同一帧 / 单调时钟</text>
<path d="M330 177V200" stroke="#526a73" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="205" width="570" height="76" rx="12" fill="#e4ece8" stroke="#879b97"/>
<text x="70" y="235" font-size="23" font-weight="bold">阶段 1：头部检测与轨迹关联</text>
<text x="70" y="264" font-size="18">YOLOv5s-P34 / 原图头框 / 短时 ID</text>
<path d="M625 243H690" stroke="#526a73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="710" y="249" font-size="20">无头 → heads 为空</text>
<path d="M330 282V305" stroke="#526a73" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="310" width="570" height="76" rx="12" fill="#e4ece8" stroke="#879b97"/>
<text x="70" y="340" font-size="23" font-weight="bold">阶段 2：头部 ROI 内找人脸</text>
<text x="70" y="369" font-size="18">YuNet 320 / 中心归属 / 最高分候选</text>
<path d="M625 348H690" stroke="#526a73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="710" y="354" font-size="20">无脸 → NO_FACE</text>
<path d="M330 387V410" stroke="#526a73" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="415" width="570" height="76" rx="12" fill="#e4ece8" stroke="#879b97"/>
<text x="70" y="445" font-size="23" font-weight="bold">阶段 3：98 点与逐点响应</text>
<text x="70" y="474" font-size="18">PIPNet / peak / gap / dispersion</text>
<path d="M625 453H690" stroke="#526a73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="710" y="459" font-size="20">裁剪无效 → ROI_INVALID</text>
<path d="M330 492V515" stroke="#526a73" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="520" width="570" height="76" rx="12" fill="#e4ece8" stroke="#879b97"/>
<text x="70" y="550" font-size="23" font-weight="bold">阶段 4：可见脸部分割</text>
<text x="70" y="579" font-size="18">FaceOcc U-Net / 每个有效脸裁剪必经</text>
<path d="M330 597V620" stroke="#526a73" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="625" width="570" height="76" rx="12" fill="#e4ece8" stroke="#879b97"/>
<text x="70" y="655" font-size="23" font-weight="bold">鼻嘴 ROI、融合与持续确认</text>
<text x="70" y="684" font-size="18">区域有效性 → 可见优先 → 姿态或融合</text>
<path d="M625 663H690" stroke="#526a73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="710" y="669" font-size="20">错误与不确定分别保留</text>
<path d="M330 702V725" stroke="#526a73" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="730" width="570" height="76" rx="12" fill="#e4ece8" stroke="#879b97"/>
<text x="70" y="760" font-size="23" font-weight="bold">阶段 5：按需物体复核</text>
<text x="70" y="789" font-size="18">World / 整图共享 / 无证据时裁剪补查</text>
<path d="M625 768H690" stroke="#526a73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="710" y="774" font-size="20">VISIBLE → 跳过</text>
<path d="M330 807V830" stroke="#526a73" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="835" width="570" height="76" rx="12" fill="#e4ece8" stroke="#879b97"/>
<text x="70" y="865" font-size="23" font-weight="bold">输出同帧图像与报告</text>
<text x="70" y="894" font-size="18">状态 / 证据 / 时序 / 参数 / 模型 / 耗时</text>
<text x="48" y="960" font-size="19">World 只增加证据，不修改原状态和持续确认。</text>
<text x="48" y="993" font-size="19">预览可以重复旧画面；显示帧率不代表推理帧率。</text>
</g></svg>