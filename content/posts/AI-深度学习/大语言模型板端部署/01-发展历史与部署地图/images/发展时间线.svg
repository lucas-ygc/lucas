<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
<title id="title">语言模型发展地图</title><desc id="desc">统计语言模型、神经表示与循环网络并行发展，注意力和 Transformer 推动预训练，后训练与高效推理扩展部署能力。</desc>
<rect width="720" height="1280" rx="20" fill="#f8f3e9"/>
<g font-family="KaiTi, STKaiti, Noto Serif CJK SC, serif" fill="#293e3c">
<text x="32" y="57" font-size="36" fill="#293e3c">语言模型的发展地图</text>
<text x="32" y="100" font-size="25" fill="#587873">按学习问题组织；技术路线交叉共存</text>
<path d="M 52 157 V 1110" stroke="#78938a" stroke-width="4"/>
<circle cx="52" cy="168" r="8" fill="#587873"/>
<rect x="78" y="138" width="610" height="126" rx="14" fill="#e7eee8"/>
<text x="96" y="172" font-size="26" fill="#293e3c">规则与统计语言模型</text>
<text x="96" y="212" font-size="24" fill="#293e3c">规则描述需求，N-gram 统计后续</text>
<text x="96" y="248" font-size="23" fill="#587873">问题：有限窗口与组合稀疏</text>
<circle cx="52" cy="310" r="8" fill="#587873"/>
<rect x="78" y="280" width="610" height="126" rx="14" fill="#e7eee8"/>
<text x="96" y="314" font-size="26" fill="#293e3c">1997 LSTM · 2003 神经语言模型</text>
<text x="96" y="354" font-size="24" fill="#293e3c">门控状态与连续向量两条代表路线</text>
<text x="96" y="390" font-size="23" fill="#587873">问题：怎样保留历史并共享规律</text>
<circle cx="52" cy="452" r="8" fill="#587873"/>
<rect x="78" y="422" width="610" height="126" rx="14" fill="#e7eee8"/>
<text x="96" y="456" font-size="26" fill="#293e3c">2014 / 2015 翻译注意力</text>
<text x="96" y="496" font-size="24" fill="#293e3c">生成时访问输入的不同位置</text>
<text x="96" y="532" font-size="23" fill="#587873">变化：不只依赖一个压缩向量</text>
<circle cx="52" cy="594" r="8" fill="#587873"/>
<rect x="78" y="564" width="610" height="126" rx="14" fill="#e7eee8"/>
<text x="96" y="598" font-size="26" fill="#293e3c">2017 Transformer</text>
<text x="96" y="638" font-size="24" fill="#293e3c">以注意力组织序列计算</text>
<text x="96" y="674" font-size="23" fill="#587873">变化：训练并行与新的资源成本</text>
<circle cx="52" cy="736" r="8" fill="#587873"/>
<rect x="78" y="706" width="610" height="126" rx="14" fill="#e7eee8"/>
<text x="96" y="740" font-size="26" fill="#293e3c">2018—2020 大规模预训练</text>
<text x="96" y="780" font-size="24" fill="#293e3c">BERT、GPT 类、T5 等不同路线</text>
<text x="96" y="816" font-size="23" fill="#587873">变化：预训练能力迁移到任务</text>
<circle cx="52" cy="878" r="8" fill="#587873"/>
<rect x="78" y="848" width="610" height="126" rx="14" fill="#e7eee8"/>
<text x="96" y="882" font-size="26" fill="#293e3c">2022—2023 指令与偏好训练</text>
<text x="96" y="922" font-size="24" fill="#293e3c">InstructGPT、DPO 等代表工作</text>
<text x="96" y="958" font-size="23" fill="#587873">变化：改进交互方式与回答行为</text>
<circle cx="52" cy="1020" r="8" fill="#587873"/>
<rect x="78" y="990" width="610" height="126" rx="14" fill="#e7eee8"/>
<text x="96" y="1024" font-size="26" fill="#293e3c">2025—2026 效率与模态扩展</text>
<text x="96" y="1064" font-size="24" fill="#293e3c">稠密 / MoE、混合结构、多模态</text>
<text x="96" y="1100" font-size="23" fill="#587873">问题：能力、内存与执行成本</text>
<rect x="32" y="1160" width="656" height="80" rx="14" fill="#eee3d4"/>
<text x="52" y="1192" font-size="23" fill="#293e3c">历史解释方法的来源，部署还要核对具体版本。</text>
<text x="52" y="1224" font-size="23" fill="#587873">年代不代表替代顺序；详见正文原始资料。</text>
</g></svg>
