<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc"><title id="title">在 PC 上运行第一个本地 LLM</title><desc id="desc">本地文字请求经模板与分词送入 CPU 模型，流式返回回答，并记录延迟与内存。</desc><rect width="1600" height="840" fill="#f5f0e6"/><g font-family="sans-serif" fill="#324e4b"><text x="100" y="150" font-size="28" letter-spacing="5">大语言模型板端部署 · 第 02 课</text><text x="100" y="245" font-size="64" font-weight="bold">先在 PC 上，让本地模型回答</text></g><g fill="#fffdf8" stroke="#b6c5bb" stroke-width="3"><rect x="100" y="345" width="340" height="245" rx="24"/><rect x="600" y="345" width="400" height="245" rx="24"/><rect x="1160" y="345" width="340" height="245" rx="24"/></g><g font-family="sans-serif" fill="#324e4b" text-anchor="middle"><text x="270" y="425" font-size="32">文本请求</text><text x="270" y="485" font-size="24">messages → 模板</text><text x="270" y="535" font-size="24">Token ID</text><text x="800" y="425" font-size="36">Qwen3 · 0.6B</text><text x="800" y="485" font-size="28">llama.cpp / CPU</text><text x="800" y="535" font-size="23">本地加载 · 逐步生成</text><text x="1330" y="425" font-size="32">流式回答</text><text x="1330" y="485" font-size="24">显示 / 取消</text><text x="1330" y="535" font-size="24">延迟 / 内存</text></g><g fill="#66857a" font-family="sans-serif" font-size="64"><text x="490" y="490">→</text><text x="1050" y="490">→</text></g><text x="100" y="710" font-family="sans-serif" font-size="30" fill="#647971">固定版本 · 单轮问答 · 可复现记录 · 为后续 TTS 接口做准备</text></svg>