<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
<title id="title">4×4 RGGB Bayer 排列</title>
<desc id="desc">红绿、绿蓝两行交替重复。共四个红色、八个绿色、四个蓝色采样位置，每格只记录一个数。</desc>
<rect width="640" height="560" rx="18" fill="#f7f3eb"/>
<g font-family="sans-serif" text-anchor="middle" fill="#384e49">
<text x="320" y="48" font-size="26">RGGB Bayer：每格一个采样值</text>
<rect x="128" y="82" width="90" height="90" rx="6" fill="#e5bbb2"/>
<text x="173" y="137" font-size="32">R</text>
<rect x="224" y="82" width="90" height="90" rx="6" fill="#c6d4bd"/>
<text x="269" y="137" font-size="32">G</text>
<rect x="320" y="82" width="90" height="90" rx="6" fill="#e5bbb2"/>
<text x="365" y="137" font-size="32">R</text>
<rect x="416" y="82" width="90" height="90" rx="6" fill="#c6d4bd"/>
<text x="461" y="137" font-size="32">G</text>
<rect x="128" y="178" width="90" height="90" rx="6" fill="#c6d4bd"/>
<text x="173" y="233" font-size="32">G</text>
<rect x="224" y="178" width="90" height="90" rx="6" fill="#b7cbdd"/>
<text x="269" y="233" font-size="32">B</text>
<rect x="320" y="178" width="90" height="90" rx="6" fill="#c6d4bd"/>
<text x="365" y="233" font-size="32">G</text>
<rect x="416" y="178" width="90" height="90" rx="6" fill="#b7cbdd"/>
<text x="461" y="233" font-size="32">B</text>
<rect x="128" y="274" width="90" height="90" rx="6" fill="#e5bbb2"/>
<text x="173" y="329" font-size="32">R</text>
<rect x="224" y="274" width="90" height="90" rx="6" fill="#c6d4bd"/>
<text x="269" y="329" font-size="32">G</text>
<rect x="320" y="274" width="90" height="90" rx="6" fill="#e5bbb2"/>
<text x="365" y="329" font-size="32">R</text>
<rect x="416" y="274" width="90" height="90" rx="6" fill="#c6d4bd"/>
<text x="461" y="329" font-size="32">G</text>
<rect x="128" y="370" width="90" height="90" rx="6" fill="#c6d4bd"/>
<text x="173" y="425" font-size="32">G</text>
<rect x="224" y="370" width="90" height="90" rx="6" fill="#b7cbdd"/>
<text x="269" y="425" font-size="32">B</text>
<rect x="320" y="370" width="90" height="90" rx="6" fill="#c6d4bd"/>
<text x="365" y="425" font-size="32">G</text>
<rect x="416" y="370" width="90" height="90" rx="6" fill="#b7cbdd"/>
<text x="461" y="425" font-size="32">B</text>
<text x="320" y="500" font-size="20">4 个 R · 8 个 G · 4 个 B</text>
<text x="320" y="531" font-size="17">颜色表示滤色片类型，不是完整 RGB 像素</text>
</g></svg>