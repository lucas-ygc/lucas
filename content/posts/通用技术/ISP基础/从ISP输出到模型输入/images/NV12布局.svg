<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
<title id="title">4×2 NV12 紧密存储示例</title>
<desc id="desc">前两行存八个 Y 字节，随后一行存 U0 V0 U1 V1 四个字节。每格一个字节，无填充。</desc>
<rect width="720" height="470" rx="18" fill="#f7f3eb"/>
<g font-family="sans-serif" text-anchor="middle" fill="#384e49">
<text x="360" y="50" font-size="27">4×2 NV12：共 12 字节</text>
<rect x="170" y="90" width="94" height="78" rx="6" fill="#dce4d5"/>
<text x="217" y="137" font-size="24">Y00</text>
<rect x="270" y="90" width="94" height="78" rx="6" fill="#dce4d5"/>
<text x="317" y="137" font-size="24">Y01</text>
<rect x="370" y="90" width="94" height="78" rx="6" fill="#dce4d5"/>
<text x="417" y="137" font-size="24">Y02</text>
<rect x="470" y="90" width="94" height="78" rx="6" fill="#dce4d5"/>
<text x="517" y="137" font-size="24">Y03</text>
<text x="92" y="137" font-size="20">偏移 0</text>
<rect x="170" y="186" width="94" height="78" rx="6" fill="#dce4d5"/>
<text x="217" y="233" font-size="24">Y10</text>
<rect x="270" y="186" width="94" height="78" rx="6" fill="#dce4d5"/>
<text x="317" y="233" font-size="24">Y11</text>
<rect x="370" y="186" width="94" height="78" rx="6" fill="#dce4d5"/>
<text x="417" y="233" font-size="24">Y12</text>
<rect x="470" y="186" width="94" height="78" rx="6" fill="#dce4d5"/>
<text x="517" y="233" font-size="24">Y13</text>
<text x="92" y="233" font-size="20">偏移 4</text>
<rect x="170" y="282" width="94" height="78" rx="6" fill="#c9dce8"/>
<text x="217" y="329" font-size="24">U0</text>
<rect x="270" y="282" width="94" height="78" rx="6" fill="#e6d3c2"/>
<text x="317" y="329" font-size="24">V0</text>
<rect x="370" y="282" width="94" height="78" rx="6" fill="#c9dce8"/>
<text x="417" y="329" font-size="24">U1</text>
<rect x="470" y="282" width="94" height="78" rx="6" fill="#e6d3c2"/>
<text x="517" y="329" font-size="24">V1</text>
<text x="92" y="329" font-size="20">偏移 8</text>
<text x="360" y="402" font-size="20">每格 1 字节 · 前 8 字节 Y · 后 4 字节 UV</text>
<text x="360" y="440" font-size="18">这是存储示意，图像高仍为 2；假设无填充</text>
</g></svg>