<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img">
<title>签名升级：从发布准备到设备确认</title>
<rect width="1200" height="650" rx="24" fill="#f7f3eb"/>
<style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif;fill:#294746}.title{font-size:32px;font-weight:700}.sub{font-size:20px}.head{font-size:23px;font-weight:600}.body{font-size:19px}</style>
<text x="50" y="65" class="title">签名升级：从发布准备到设备确认</text>
<text x="50" y="103" class="sub">常规版本沿用已有密钥；以下流程不包含首次分区迁移或 boot 更新。</text>
<rect x="50" y="145" width="340" height="150" rx="14" fill="#ffffff" stroke="#a3b7ac" stroke-width="2"/>
<text x="70" y="184" class="head">① 确认项目与密钥</text>
<text x="70" y="223" class="body">产品、硬件、公钥指纹</text>
<text x="70" y="257" class="body">发布私钥必须与项目公钥配对</text>
<text x="399" y="227" class="title">→</text>
<rect x="430" y="145" width="340" height="150" rx="14" fill="#ffffff" stroke="#a3b7ac" stroke-width="2"/>
<text x="450" y="184" class="head">② 准备构建产物</text>
<text x="450" y="223" class="body">build → import-kernel → pack</text>
<text x="450" y="257" class="body">核对 FIT、SquashFS 及版本记录</text>
<text x="779" y="227" class="title">→</text>
<rect x="810" y="145" width="340" height="150" rx="14" fill="#ffffff" stroke="#a3b7ac" stroke-width="2"/>
<text x="830" y="184" class="head">③ 正式 OTA 打包</text>
<text x="830" y="223" class="body">仅本次传入 UPGRADE_SIGN_KEY</text>
<text x="830" y="257" class="body">保留包、摘要和发布状态</text>
<rect x="50" y="335" width="340" height="150" rx="14" fill="#ffffff" stroke="#a3b7ac" stroke-width="2"/>
<text x="70" y="374" class="head">④ 离线检查与选择设备</text>
<text x="70" y="413" class="body">可信公钥检查包签名和内容</text>
<text x="70" y="447" class="body">确认设备身份，选择 .pkg</text>
<text x="399" y="417" class="title">→</text>
<rect x="430" y="335" width="340" height="150" rx="14" fill="#ffffff" stroke="#a3b7ac" stroke-width="2"/>
<text x="450" y="374" class="head">⑤ 传输与刷写</text>
<text x="450" y="413" class="body">设备验签、收包、核对摘要</text>
<text x="450" y="447" class="body">写入非当前槽并读回校验</text>
<text x="779" y="417" class="title">→</text>
<rect x="810" y="335" width="340" height="150" rx="14" fill="#ffffff" stroke="#a3b7ac" stroke-width="2"/>
<text x="830" y="374" class="head">⑥ 重启与业务验证</text>
<text x="830" y="413" class="body">重新连接，检查实际运行版本</text>
<text x="830" y="447" class="body">保存启动确认与业务结果</text>
<text x="50" y="575" class="sub">相同内容可能直接跳过；有效签名的旧版本当前允许更新。</text>
<text x="50" y="612" class="sub">刷写阶段断线：先查询结果，不要自动重发。私钥始终留在受控签名环境。</text>
</svg>