<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">云台实战 01 硬件接线与双轴驱动</title><desc id="desc">ptzctl，提交有限运动；ioctl 控制，参数与并发检查；双轴状态，位置、相位与目标；H / V 定时器，每次回调推进一拍；GPIO 与 ULN2803，四相八拍半步；机械输出，计数不等于实测角度</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#527572"/></marker></defs><rect width="1200" height="650" fill="#f5f0e7"/><g font-family="sans-serif" fill="#233b3a"><text x="65" y="60" font-size="18" fill="#527572" letter-spacing="3">LUCAS / PTZ 01</text><text x="65" y="116" font-size="42" font-weight="700">硬件接线与双轴驱动</text><text x="65" y="155" font-size="22" fill="#5b6b67">Hi3516CV610 · 相序、GPIO 与独立定时</text><rect x="65" y="205" width="320" height="112" rx="12" fill="#dfe9df" stroke="#a4b7ad"/><text x="225" y="250" text-anchor="middle" font-size="27">ptzctl</text><text x="225" y="287" text-anchor="middle" font-size="18" fill="#5b6b67">提交有限运动</text>
<rect x="440" y="205" width="320" height="112" rx="12" fill="#fffdf8" stroke="#a4b7ad"/><text x="600" y="250" text-anchor="middle" font-size="27">ioctl 控制</text><text x="600" y="287" text-anchor="middle" font-size="18" fill="#5b6b67">参数与并发检查</text>
<rect x="815" y="205" width="320" height="112" rx="12" fill="#fffdf8" stroke="#a4b7ad"/><text x="975" y="250" text-anchor="middle" font-size="27">双轴状态</text><text x="975" y="287" text-anchor="middle" font-size="18" fill="#5b6b67">位置、相位与目标</text>
<rect x="815" y="390" width="320" height="112" rx="12" fill="#fffdf8" stroke="#a4b7ad"/><text x="975" y="435" text-anchor="middle" font-size="27">H / V 定时器</text><text x="975" y="472" text-anchor="middle" font-size="18" fill="#5b6b67">每次回调推进一拍</text>
<rect x="440" y="390" width="320" height="112" rx="12" fill="#fffdf8" stroke="#a4b7ad"/><text x="600" y="435" text-anchor="middle" font-size="27">GPIO 与 ULN2803</text><text x="600" y="472" text-anchor="middle" font-size="18" fill="#5b6b67">四相八拍半步</text>
