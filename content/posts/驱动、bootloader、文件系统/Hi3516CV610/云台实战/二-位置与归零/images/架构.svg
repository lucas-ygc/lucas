<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">云台实战 02 位置控制与用户态归零</title><desc id="desc">A 开始归零，GUARD 记录序号；A 寻找零点，有限 MOVE_TO；B 提交新目标，同轴 generation 增加；A 查询状态，superseded = 1；A 清理或回中，ESTALE 拒绝旧命令；B 继续执行，旧流程不能覆盖新动作</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#527572"/></marker></defs><rect width="1200" height="650" fill="#f5f0e7"/><g font-family="sans-serif" fill="#233b3a"><text x="65" y="60" font-size="18" fill="#527572" letter-spacing="3">LUCAS / PTZ 02</text><text x="65" y="116" font-size="42" font-weight="700">位置控制与用户态归零</text><text x="65" y="155" font-size="22" fill="#5b6b67">Hi3516CV610 · 按轴保护，明确参考状态</text><rect x="65" y="205" width="320" height="112" rx="12" fill="#dfe9df" stroke="#a4b7ad"/><text x="225" y="250" text-anchor="middle" font-size="27">A 开始归零</text><text x="225" y="287" text-anchor="middle" font-size="18" fill="#5b6b67">GUARD 记录序号</text>
<rect x="440" y="205" width="320" height="112" rx="12" fill="#fffdf8" stroke="#a4b7ad"/><text x="600" y="250" text-anchor="middle" font-size="27">A 寻找零点</text><text x="600" y="287" text-anchor="middle" font-size="18" fill="#5b6b67">有限 MOVE_TO</text>
<rect x="815" y="205" width="320" height="112" rx="12" fill="#fffdf8" stroke="#a4b7ad"/><text x="975" y="250" text-anchor="middle" font-size="27">B 提交新目标</text><text x="975" y="287" text-anchor="middle" font-size="18" fill="#5b6b67">同轴 generation 增加</text>
<rect x="815" y="390" width="320" height="112" rx="12" fill="#fffdf8" stroke="#a4b7ad"/><text x="975" y="435" text-anchor="middle" font-size="27">A 查询状态</text><text x="975" y="472" text-anchor="middle" font-size="18" fill="#5b6b67">superseded = 1</text>
<rect x="440" y="390" width="320" height="112" rx="12" fill="#fffdf8" stroke="#a4b7ad"/><text x="600" y="435" text-anchor="middle" font-size="27">A 清理或回中</text><text x="600" y="472" text-anchor="middle" font-size="18" fill="#5b6b67">ESTALE 拒绝旧命令</text>
